version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vite-and-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - '@tailwindcss/*'
          - tailwindcss
          - typescript
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly